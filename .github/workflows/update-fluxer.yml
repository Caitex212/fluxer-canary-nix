
name: Update Fluxer Canary

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Resolve latest version and hash
        id: update
        shell: bash
        run: |
          set -euo pipefail

          latest="https://api.canary.fluxer.app/dl/desktop/canary/linux/x64/latest/appimage"

          url=$(curl -fsSL -o /dev/null -w '%{url_effective}' "$latest")

          version=$(printf '%s\n' "$url" |
            sed -nE 's|.*/linux/x64/([^/]+)/appimage$|\1|p')

          if [[ -z "$version" ]]; then
            echo "::error::Could not resolve a versioned download URL: $url"
            exit 1
          fi

          hash=$(nix-prefetch-url "$url")

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Update flake.nix
        env:
          VERSION: ${{ steps.update.outputs.version }}
          URL: ${{ steps.update.outputs.url }}
          HASH: ${{ steps.update.outputs.hash }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("flake.nix")
          text = path.read_text()

          replacements = [
              (r'version = "[^"]+";',
               f'version = "{os.environ["VERSION"]}";'),
              (r'url = "[^"]+/appimage";',
               f'url = "{os.environ["URL"]}";'),
              (r'sha256 = "[^"]+";',
               f'sha256 = "{os.environ["HASH"]}";'),
          ]

          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match for {pattern}"
                  )

          path.write_text(text)
          PY

      
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3"

            if nix build .#fluxer-canary --no-link; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Fluxer download or Nix build failed after 3 attempts"
          exit 1

      
      - name: Commit and push update to main
        run: |
          set -euo pipefail

          if git diff --quiet -- flake.nix; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flake.nix
          git commit -m "chore: update Fluxer Canary"
          git push origin HEAD:main

