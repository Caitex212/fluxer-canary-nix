
name: Update Fluxer Canary

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Resolve latest version and hash
        id: update
        shell: bash
        run: |
          set -euo pipefail

          base="https://pkgs.fluxer.com/desktop/canary/linux/x64"

          # `latest` returns JSON describing the current release.
          meta=$(curl -fsSL -H 'Accept: application/json' "$base/latest")
          echo "$meta"

          version=$(printf '%s' "$meta" | jq -r '.version // .latest.version // empty')

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read a version from release metadata"
            exit 1
          fi

          url="$base/$version/appimage"

          # Prefetch the *versioned* URL so the hash can never drift.
          raw=$(nix-prefetch-url --type sha256 "$url")
          hash=$(nix hash convert --hash-algo sha256 --to sri "$raw")

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Update flake.nix
        env:
          VERSION: ${{ steps.update.outputs.version }}
          HASH: ${{ steps.update.outputs.hash }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("flake.nix")
          text = path.read_text()

          replacements = [
              (r'version = "[^"]+";',
               f'version = "{os.environ["VERSION"]}";'),
              (r'hash = [^;]+;',
               f'hash = "{os.environ["HASH"]}";'),
          ]

          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match for {pattern}"
                  )

          path.write_text(text)
          PY

      
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3"

            if nix build .#fluxer-canary --no-link; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Fluxer download or Nix build failed after 3 attempts"
          exit 1

      
      - name: Commit and push update to main
        run: |
          set -euo pipefail

          if git diff --quiet -- flake.nix; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flake.nix
          git commit -m "chore: update Fluxer Canary to ${{ steps.update.outputs.version }}"
          git push origin HEAD:main

